[package]
name = "pwrs-write-color-ex"
version = "1.2.2"
authors = ["Mark Newton"]
edition = "2024"
rust-version = "1.98"
description = """Colored and styled console output for PowerShell: TrueColor, ANSI 256 and 16 colors, \
gradients, markup, highlighting, links, text styles, style profiles, padding and wrapping that count wide \
characters, and logging to a file. \
The commands, parameters, aliases and output of PSWriteColorEX \
(https://github.com/MarkusMcNugen/PSWriteColorEX), so a script written for it runs unchanged. \
Bound directly to Rust with PoWerRuSt (pwrs), Rust bindings for writing PowerShell binary modules in the \
spirit of PyO3: the cmdlets are the library, not a wrapper over a command line. Windows x64 and arm64, \
Linux x64 and arm64 (glibc 2.35 and newer), macOS arm64 and x64, and FreeBSD x64 in one module, on \
PowerShell 7.4 or later and, on Windows, Windows PowerShell 5.1. Source and issues at \
https://github.com/Variably-Constant/PWRSWriteColorEX; the binding framework at \
https://github.com/Variably-Constant/PWRS and https://crates.io/crates/PoWerRuSt."""
license = "MIT"
repository = "https://github.com/Variably-Constant/PWRSWriteColorEX"
keywords = ["powershell", "color", "ansi", "truecolor", "console", "cmdlet"]
# Ships as a PowerShell module, not to crates.io.
publish = false

# The module manifest's CompanyName, Copyright, LicenseUri and ReleaseNotes;
# Author is `authors` and ProjectUri is `repository`.
[package.metadata.pwrs]
company = "Variably Constant"
copyright = "(c) 2026 Mark Newton"
license-uri = "https://github.com/Variably-Constant/PWRSWriteColorEX/blob/main/LICENSE"
# The manifest's Tags, after the `pwrs` tag cargo-pwrs writes first: PSWriteColorEX's, so the
# PowerShell Gallery lists the two modules under the same searches and edition filters, and the
# platforms and language that are this module's own.
tags = [
    "Console", "Color", "Colour", "ANSI", "Terminal", "Output", "Formatting", "Logging", "TrueColor", "RGB", "CrossPlatform",
    "Windows", "Linux", "macOS", "FreeBSD", "PSEdition_Desktop", "PSEdition_Core", "Rust", "PSWriteColorEX",
]
release-notes = """The commands, parameters and output of PSWriteColorEX 1.2.1, built with PWRS 1.0.0. Each \
runspace that imports the module has its own registered color names and detected color support, as each \
import of PSWriteColorEX has, so another runspace's import, such as ForEach-Object -Parallel's, neither \
clears them nor sees them. Get-Help gives every parameter the default value PSWriteColorEX's help gives, and \
Show-ColorTable -Name and Export-ColorProfile -Name take wildcards, as its do. A call reads which parameters \
it was given only when it applies a style profile. With PWRS 1.0.0, importing the module loads no other \
module, and a copy of the same version imported from another folder, as a module that bundles this one \
imports it, stands down. In Windows PowerShell 5.1 the module cannot share a session with a module built by \
PWRS 0.8.0 or earlier. The full list is in CHANGELOG.md: \
https://github.com/Variably-Constant/PWRSWriteColorEX/blob/main/CHANGELOG.md"""

# The module's native library, and a Rust library another PWRS module can link.
[lib]
name = "pwrs_write_color_ex"
crate-type = ["cdylib", "rlib"]
# The doc comments hold PowerShell, not Rust examples.
doctest = false

# `module` exports the PowerShell module: export_module! and the import hook. A
# crate that links the library depends on it with default-features = false, so
# it carries none of the module's exports.
[features]
default = ["module"]
module = []

[dependencies]
# The binding framework, published on crates.io as PoWerRuSt, since crates.io
# carries an unrelated `pwrs`; the library it builds is still `pwrs`, which is
# what the source writes. cargo-pwrs builds the module and takes the same
# version.
pwrs = { package = "PoWerRuSt", version = "1.0.0" }
# Display width of each code point, the table PSWriteColorEX's Measure-DisplayWidth
# is generated from, so both modules measure text alike.
unicode-width = "=0.2.2"
# SwapCell, from the SubEtha IPC stack's core: the registered color names, which any
# thread reads without waiting while a change swaps in a new table.
subetha-core = "0.6.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

# A workspace of its own, so tools/ builds apart.
[workspace]

# The module ships from the release profile. Unwinding stays on: PWRS turns a
# panic at the boundary into a terminating error, where abort would end the
# PowerShell process.
[profile.release]
lto = "fat"
codegen-units = 1
